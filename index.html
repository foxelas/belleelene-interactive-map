<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>belleelene · a map of my wanderings</title>
  <meta name="description" content="An interactive map of the countries, mountains and islands I've travelled — year by year." />

  <link rel="icon" href="icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="foxGrad" x1="0" y1="0" x2="1" y2="1">
        <stop id="foxStop0" offset="0%"  stop-color="#7ec6f0" />
        <stop id="foxStop1" offset="52%" stop-color="#9db4f0" />
        <stop id="foxStop2" offset="100%" stop-color="#c4b0e8" />
      </linearGradient>
      <linearGradient id="homeGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"  stop-color="#f8d976" />
        <stop offset="100%" stop-color="#eaa64c" />
      </linearGradient>
    </defs>
  </svg>

  <div class="wrap">

    <header class="top">
      <img class="logo" id="brandLogo" src="logo.png" alt="belleelene fox logo" />
      <div class="brand">
        <h1 id="brandName">belleelene</h1>
        <div class="tag" id="brandTag">a map of my <b>wanderings</b></div>
      </div>
      <span class="spacer"></span>
      <a class="site-link" id="siteLink" href="https://belleelene.com/" target="_blank" rel="noopener">belleelene.com ↗</a>
    </header>

    <section class="console" aria-label="Interactive travel map">
      <div class="console-head">
        <div class="tabs" role="tablist" aria-label="Choose a map"></div>
        <div class="stats" aria-live="polite">
          <div class="big" id="statBig">—</div>
          <div class="sub" id="statSub"></div>
        </div>
      </div>

      <div class="map-shell">
        <div id="map"></div>
        <div class="map-fade"></div>
        <div class="year-list" id="yearList"></div>
        <div class="year-list themes" id="themes"></div>
        <div class="legend" id="legend"></div>
      </div>

      <div class="slider">
        <div class="slider-top">
          <div class="year-now all" id="yearNow"><em>All years</em></div>
        </div>
        <div class="range-row">
          <input type="range" class="years" id="range" aria-label="Filter by year" />
          <div class="ticks" id="ticks"></div>
        </div>
      </div>
    </section>

    <div id="extras"></div>

    <footer class="foot">
      <span>
        Built by <a href="https://belleelene.com/" target="_blank" rel="noopener">belleelene</a>.
        Make your <a href="builder.html">own map</a>.
      </span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="vendor/leaflet.js"></script>
  <script src="icons.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
